# Runs the unit tests (pure card, thread, organisation, journal and viewport logic; no Foundry
# needed) on every push to main and on pull requests, and on demand from the Actions tab.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test test/*.test.mjs
